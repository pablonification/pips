<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!--
      The head LINE's crawler gets in place of index.html (the Caddyfile). LINE shows a link's picture as a small
      square, which would crop the wide og-image.png, so here the picture is the HMIF logo on ink
      (scripts/icons/build-icons.py). Everything else matches index.html, which tests/seo.test.mjs checks.
    -->
    <title>PIPS!</title>
    <meta
      name="description"
      content="Aplikasi resmi HMIF ITB untuk pengumuman, kalender kegiatan dan akademik, Testi Matkul, NIM Finder, Curhat Yuk!, dan layanan anggota lainnya."
    />
    <link rel="canonical" href="https://app.hmif.dev/login" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PIPS!" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:url" content="https://app.hmif.dev/" />
    <meta property="og:title" content="PIPS! · HMIF ITB" />
    <meta
      property="og:description"
      content="Aplikasi resmi HMIF ITB untuk pengumuman, kalender kegiatan dan akademik, Testi Matkul, NIM Finder, Curhat Yuk!, dan layanan anggota lainnya."
    />
    <meta property="og:image" content="https://app.hmif.dev/og-image-square.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="Logo HMIF ITB" />
  </head>
  <body>
    <a href="/">PIPS!</a>
  </body>
</html>
