<!doctype html>
<html lang="id" class="relative">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FCFBF8" />
    <!--
      Theme before first paint (P0-A): the stored preference (system, light or dark; default system) sets the .dark
      class, color-scheme and the theme colour. Same rules as src/lib/theme/theme-core.mjs; tests/garis-theme.test.mjs
      runs this script and checks they agree.
    -->
    <script data-theme-prepaint>
      (function () {
        var pref = 'system';
        try {
          pref = localStorage.getItem('pips:theme') || 'system';
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0A0907' : '#FCFBF8');
      })();
    </script>
    <link
      rel="preload"
      href="/fonts/geist-latin-400-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="msapplication-TileColor" content="#ffc40d" />
    <title>HMIF App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
