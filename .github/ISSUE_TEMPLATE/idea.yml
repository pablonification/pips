name: An idea
description: Something PIPS! could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is hard or missing today?
      description: Describe it from a member's point of view.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen instead?
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who needs it, and how often?
      description: All members, one angkatan, one role? Every day, or once a semester?
  - type: markdown
    attributes:
      value: |
        PIPS!'s look is settled, so a request to change how something looks needs a strong reason. Say what
        goes wrong for members today.
