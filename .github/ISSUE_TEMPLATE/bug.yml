name: Something is broken
description: PIPS! does something wrong, or does not work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please do not put anyone's real name, student number or message in this report. If it is about
        privacy or sign-in, do not post it here: use **Security → Report a vulnerability** instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you see, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it ourselves?
      description: The steps, starting from the page you opened.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Device and browser
      description: For example, "Android phone, Chrome, installed app" or "Mac, Safari".
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: A screenshot helps. Hide anything personal first.
