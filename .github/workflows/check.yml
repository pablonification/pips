name: check

on:
  pull_request:
    branches: [main, redesign]
  push:
    branches: [main, redesign]

jobs:
  commits:
    name: commit messages
    # Conventional Commits for every commit a pull request adds (owner's rule, 2026-10-13).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The check's own tests
        run: node --test scripts/*.test.mjs
      - name: Every new commit is a Conventional Commit
        run: node scripts/commit-messages.mjs "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"

  check:
    name: check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Uses the pnpm version in package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type check and lint
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: No test login in the production bundle
        run: node apps/web/scripts/verify-production-bundle.mjs apps/web/dist

  docker:
    name: docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both images build from the repository root, as Dokploy will build them.
      - name: Build the web image
        run: docker build -f apps/web/Dockerfile -t pips-web .
      - name: Build the api image
        run: docker build -f apps/api/Dockerfile -t pips-api .
      - name: The web image serves index.html, also for app routes
        run: |
          docker run -d --name web -p 3000:3000 pips-web
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/ -o /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:3000/home | grep -q '<div id="root">'
          curl -fsS -o /dev/null http://127.0.0.1:3000/manifest.webmanifest
      - name: The api image starts and serves until it needs its database
        run: |
          # Placeholder settings only: nothing here is a real secret, and the database address leads nowhere.
          # Web push checks its key pair at startup, so make a throwaway one with the image's own web-push.
          read -r PUB PRIV < <(docker run --rm pips-api node -e \
            "const k=require('web-push').generateVAPIDKeys();console.log(k.publicKey+' '+k.privateKey)")
          docker run -d --name api -p 5000:5000 \
            -e VAPID_PUBLIC_KEY="$PUB" -e VAPID_PRIVATE_KEY="$PRIV" \
            -e DATABASE_URL=postgres://pips:pips@127.0.0.1:1/pips \
            -e SMTP_HOST=localhost -e SMTP_PORT=25 -e SMTP_PASS=ci \
            -e GOOGLE_CLIENT_ID=ci -e GOOGLE_CLIENT_SECRET=ci \
            -e GOOGLE_CALLBACK_URL=http://127.0.0.1/callback \
            -e JWT_SECRET=ci -e TOKEN_EXPIRATION=1h \
            -e R2_ENDPOINT=http://127.0.0.1:1 -e R2_PUBLIC_URL=http://127.0.0.1:1 \
            pips-api
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5000/ -o /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5000/ | grep -q 'Server runs successfully'
          docker logs api 2>&1 | grep -q 'Server is running on port 5000'
          # Routes that need the database answer; /api/me without a session is 401 before any query.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/me)" = 401
          test "$(docker inspect -f '{{.State.Running}}' api)" = true
          # Regression (2026-10-13): the calendar cron runs every minute, and its first run with no database used
          # to end the API. Wait for that run, then the API must still answer and have logged the failure.
          for i in $(seq 1 75); do docker logs api 2>&1 | grep -q 'Calendar cron failed:' && break; sleep 1; done
          docker logs api 2>&1 | grep -q 'Calendar cron failed:'
          sleep 2
          test "$(docker inspect -f '{{.State.Running}}' api)" = true
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/me)" = 401
      - name: Container logs
        if: always()
        run: |
          docker logs web 2>&1 | tail -n 50 || true
          docker logs api 2>&1 | tail -n 80 || true

  e2e:
    name: e2e shard ${{ matrix.shard }}/4
    # The browser journeys run on pull requests to main and redesign, split in four so each part finishes in time
    # (the whole suite passed 30 minutes on one runner by 2026-10-13).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Journeys (builds the app for production and serves it with vite preview)
        run: pnpm --filter web run e2e --shard=${{ matrix.shard }}/4
        env:
          E2E_WORKERS: 2
      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.results
          retention-days: 14

  e2e-result:
    name: e2e (web journeys)
    # One result for the four shards, under the check name the merge protocol reads.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.e2e.result }}" = "success"
