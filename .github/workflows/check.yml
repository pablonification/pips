name: check

on:
  pull_request:
    branches: [main, redesign]
  push:
    branches: [main, redesign]

jobs:
  commits:
    name: commit messages
    # Conventional Commits for every commit a pull request adds (owner's rule, 2026-10-13).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The check's own tests
        run: node --test scripts/*.test.mjs
      - name: Every new commit, and the pull request's title, is a Conventional Commit
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/commit-messages.mjs "origin/$BASE_REF" "$HEAD_SHA"

  check:
    name: check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Uses the pnpm version in package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: No real member's details in the repository
        run: node --test scripts/*.test.mjs
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type check and lint
        run: pnpm check
      # The web app's API client is generated from the API and committed: a route changed without regenerating it
      # would ship a client that lies about the shapes. Status also catches new and deleted files.
      - name: The generated API client matches the API
        run: |
          pnpm --filter web api
          changed="$(git status --porcelain -- apps/web/src/api/generated)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "Run 'pnpm --filter web api' and commit apps/web/src/api/generated."
            exit 1
          fi
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      # No test login, gallery, shell test page, prototypes or source maps; the precache and the service worker as
      # SPEC says (C1).
      - name: Production bundle, precache and service worker
        run: node apps/web/scripts/verify-production-bundle.mjs apps/web/dist
      # Per-route JS before first render (capped at 205 KiB), precache and fonts; fails over budget.
      - name: Budgets
        run: pnpm --filter web budgets

  api-db:
    name: api database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # 16 is the local development cluster's version; production runs a newer one.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pips_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests refuse any database that is not local and named pips_test*; they migrate it themselves, and the
      # migration test creates more databases beside it, so the role is a superuser.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pips_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The post audience SQL, the room limit under parallel requests, a resent Curhat message saved once, the
      # migration counter repair, search with odd characters and the statement timeout only show on a real database.
      - name: Database tests
        run: pnpm --filter api test:db
      # drizzle-kit writes a new migration when the schema differs from the last snapshot: any new file is drift.
      - name: The migrations match the schema
        working-directory: apps/api
        run: |
          rm -rf .drizzle-check
          cp -R drizzle .drizzle-check
          DATABASE_URL=unused pnpm exec drizzle-kit generate --dialect postgresql --schema ./src/db/schema.ts --out .drizzle-check
          if ! diff -r drizzle .drizzle-check; then
            echo "schema.ts has changes no migration covers: run 'pnpm --filter api db:migrations' and commit the result."
            exit 1
          fi

  docker:
    name: docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both images build from the repository root, as Dokploy will build them.
      # Placeholder addresses, so the content policy has an API, a file store and Sentry to name.
      - name: Build the web image
        run: |
          docker build -f apps/web/Dockerfile -t pips-web \
            --build-arg VITE_API_URL=https://api.pips.test \
            --build-arg VITE_MEDIA_URL=https://media.pips.test \
            --build-arg VITE_SENTRY_DSN=https://key@o1.ingest.sentry.io/1 .
      - name: Build the api image
        run: docker build -f apps/api/Dockerfile -t pips-api .
      - name: The web image serves index.html, also for app routes
        run: |
          docker run -d --name web -p 3000:3000 pips-web
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/ -o /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:3000/home | grep -q '<div id="root">'
          curl -fsS -o /dev/null http://127.0.0.1:3000/manifest.webmanifest
          curl -fsS http://127.0.0.1:3000/pengumuman | grep -q '<div id="root">'
          # Every response is revalidated, so after a deploy no browser keeps an index.html that points at scripts the
          # new image no longer has; and every response carries the protective headers.
          for path in / /home /sw.js "/assets/$(docker exec web ls /srv/assets | grep -m1 '\.js$')"; do
            headers="$(curl -fsSI "http://127.0.0.1:3000$path")"
            grep -qi '^cache-control: public, max-age=0, must-revalidate' <<<"$headers"
            grep -qi '^x-content-type-options: nosniff' <<<"$headers"
            grep -qi '^referrer-policy: strict-origin-when-cross-origin' <<<"$headers"
            grep -qi '^x-frame-options: DENY' <<<"$headers"
          done
      - name: The web image sends its content policy, compresses, and answers a missing file with 404
        run: |
          csp="$(curl -fsSI http://127.0.0.1:3000/ | grep -i '^content-security-policy-report-only:')"
          echo "$csp"
          for source in "frame-ancestors 'none'" "'sha256-" https://api.pips.test wss://api.pips.test \
            https://media.pips.test https://o1.ingest.sentry.io https://accounts.google.com/gsi/client; do
            grep -qF "$source" <<<"$csp"
          done
          # The entry script, as index.html names it, comes compressed.
          html="$(curl -fsS http://127.0.0.1:3000/)"
          entry="$(grep -o -m1 'src="/assets/[^"]*\.js"' <<<"$html" | cut -d'"' -f2)"
          test -n "$entry"
          for encoding in gzip zstd; do
            headers="$(curl -fsS -H "Accept-Encoding: $encoding" -D - -o /dev/null "http://127.0.0.1:3000$entry")"
            grep -qi "^content-encoding: $encoding" <<<"$headers"
          done
          # A file that isn't in the build is a 404, not the app's page; build metadata isn't served.
          for path in /assets/x.js /assets/x /x.png /.vite/manifest.json /chunk-modules.json; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path")" = 404
          done
          test "$(docker exec web find /srv -name '.vite' -o -name '*.map' | wc -l)" = 0
      - name: The api image starts and serves until it needs its database
        run: |
          # Placeholder settings only: nothing here is a real secret, and the database address leads nowhere.
          # Web push checks its key pair at startup, so make a throwaway one with the image's own web-push.
          read -r PUB PRIV < <(docker run --rm pips-api node -e \
            "const k=require('web-push').generateVAPIDKeys();console.log(k.publicKey+' '+k.privateKey)")
          docker run -d --name api -p 5000:5000 \
            -e VAPID_PUBLIC_KEY="$PUB" -e VAPID_PRIVATE_KEY="$PRIV" \
            -e DATABASE_URL=postgres://pips:pips@127.0.0.1:1/pips \
            -e GOOGLE_CLIENT_ID=ci -e GOOGLE_CLIENT_SECRET=ci \
            -e GOOGLE_CALLBACK_URL=http://127.0.0.1/callback \
            -e JWT_SECRET=ci-placeholder-secret-of-32-characters -e TOKEN_EXPIRATION=3600 \
            -e R2_ENDPOINT=http://127.0.0.1:1 -e R2_PUBLIC_URL=http://127.0.0.1:1 \
            pips-api
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5000/ -o /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5000/ | grep -q 'Server runs successfully'
          docker logs api 2>&1 | grep -q 'Server is running on port 5000'
          # Routes that need the database answer; /api/me without a session is 401 before any query.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/me)" = 401
          test "$(docker inspect -f '{{.State.Running}}' api)" = true
          # Regression (2026-10-13): the calendar cron runs every minute, and its first run with no database used
          # to end the API. Wait for that run, then the API must still answer and have logged the failure.
          for i in $(seq 1 75); do docker logs api 2>&1 | grep -q 'Calendar cron failed:' && break; sleep 1; done
          docker logs api 2>&1 | grep -q 'Calendar cron failed:'
          sleep 2
          test "$(docker inspect -f '{{.State.Running}}' api)" = true
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/me)" = 401
      - name: Both images run unprivileged, report health, and the api stops cleanly
        run: |
          test "$(docker exec web id -u)" != 0
          test "$(docker exec api id -u)" != 0
          test -n "$(docker inspect -f '{{.Config.Healthcheck}}' web | grep wget)"
          test -n "$(docker inspect -f '{{.Config.Healthcheck}}' api | grep wget)"
          # /health checks the database, which leads nowhere here.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/health)" = 503
          # SIGTERM reaches the API (node is PID 1) and it exits 0 well inside docker stop's 10 s.
          docker stop -t 10 api
          test "$(docker inspect -f '{{.State.ExitCode}}' api)" = 0
          docker logs api 2>&1 | grep -q 'Shut down cleanly'
      - name: Container logs
        if: always()
        run: |
          docker logs web 2>&1 | tail -n 50 || true
          docker logs api 2>&1 | tail -n 80 || true

  e2e:
    name: e2e shard ${{ matrix.shard }}/4
    # The browser journeys run on pull requests to main and redesign, split in four so each part finishes in time
    # (the whole suite passed 30 minutes on one runner by 2026-10-13). Each part had 30 minutes until 2026-11-06, when
    # parts of about 1,340 journeys were stopped at 30 with none failed (828 and 1,121 done) on busy runners.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Journeys (builds the app for production and serves it with vite preview)
        run: pnpm --filter web run e2e --shard=${{ matrix.shard }}/4
        env:
          E2E_WORKERS: 2
          # Strict gates on every journey, old screens included: every screen is replaced by now, and C1 (cleanup)
          # starts only from a branch that passes them (C1 brief, "Start").
          E2E_GATES: strict
      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.results
          retention-days: 14

  e2e-solo:
    name: e2e solo (timed journeys, one at a time)
    # The journeys tagged @solo time the main thread, so they run with nothing beside them: in a shard, the other
    # worker's test alone pushed them over budget on CI's runner (2026-11-02).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Timed journeys
        run: pnpm --filter web run e2e:solo
        env:
          E2E_GATES: strict
      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-solo
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.results
          retention-days: 14

  e2e-result:
    name: e2e (web journeys)
    # One result for the four shards and the solo run, under the check name the merge protocol reads.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [e2e, e2e-solo]
    runs-on: ubuntu-latest
    steps:
      - name: Every shard and the solo run passed
        run: test "${{ needs.e2e.result }}" = "success" && test "${{ needs.e2e-solo.result }}" = "success"
