name: check

on:
  pull_request:
    branches: [main, redesign]
  push:
    branches: [main, redesign]

jobs:
  check:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type check and lint
        run: pnpm --filter ${{ matrix.app }} run check
      - name: Unit tests
        run: pnpm --filter ${{ matrix.app }} --if-present run test
      - name: Production build
        if: matrix.app == 'web'
        run: pnpm --filter web run build && node apps/web/scripts/verify-production-bundle.mjs apps/web/dist

  e2e:
    name: e2e (web journeys)
    # The browser journeys run on pull requests to main and redesign.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Journeys (builds the app for production and serves it with vite preview)
        run: pnpm --filter web e2e
        env:
          E2E_WORKERS: 2
      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.results
          retention-days: 14
